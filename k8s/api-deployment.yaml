
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskly-api
  namespace: mlflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: taskly-api
  template:
    metadata:
      labels:
        app: taskly-api
    spec:
      containers:
        - name: taskly-api
          image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/taskly-api:1.0
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlflow.svc.cluster.local:5000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-db
                  key: DATABASE_URL

            - name: REDIS_URL
              value: "redis://taskly-redis-master.mlflow.svc.cluster.local:6379/0"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: taskly-api
  namespace: mlflow
spec:
  selector:
    app: taskly-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
