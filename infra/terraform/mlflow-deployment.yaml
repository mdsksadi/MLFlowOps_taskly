apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      containers:
        - name: mlflow
          image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/taskly-mlflow:v3.5.0
          ports:
            - containerPort: 5000
          command: ["mlflow"]
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - postgresql://mlflow:$(MLFLOW_DB_PASSWORD)@mlflow-postgresql.mlflow.svc.cluster.local:5432/mlflow
            - --serve-artifacts
            - --artifacts-destination
            - s3://taskly-mlflow-artifacts-686699774218-us-east-1/
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgresql
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
