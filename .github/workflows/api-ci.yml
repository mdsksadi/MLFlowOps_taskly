
name: Taskly API CI

on:
  push:
    branches:
      - main
      - feature/api-observability
  pull_request:
    branches:
      - main

jobs:
  api-build:
    name: API Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            -t taskly-api:ci \
            .
